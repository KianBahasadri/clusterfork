<dialog class="spotlight-dialog" id="spotlightDialog" aria-label="Search and commands">
  <div class="spotlight-search-field">
    <label class="sr-only" id="spotlightInputLabel" for="spotlightInput">Search commands</label>
    <svg class="icon spotlight-search-icon" aria-hidden="true"><use href="#lucide-search"></use></svg>
    <input class="spotlight-input" id="spotlightInput" type="search" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="spotlightResults" autocomplete="off" spellcheck="false" placeholder="Search commands">
  </div>
  <ul class="spotlight-results" id="spotlightResults" role="listbox" aria-label="Commands">
    <li class="spotlight-option" id="spotlightJumpTo" role="option" aria-selected="false" data-spotlight-mode="commands" data-spotlight-action="jump-to" data-search="jump go navigate component section" data-shortcut-code="KeyJ" data-shortcut-key="J"><span class="spotlight-option-label">Jump to…</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-option" id="spotlightExportMarkdown" role="option" aria-selected="false" data-spotlight-mode="commands" data-spotlight-action="export-markdown" data-search="export download markdown md" data-shortcut-code="KeyM" data-shortcut-key="M" data-shortcut-shift="true"><span class="spotlight-option-label">Export as Markdown</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-option" id="spotlightExportPdf" role="option" aria-selected="false" data-spotlight-mode="commands" data-spotlight-action="export-pdf" data-search="export download print pdf" data-shortcut-code="KeyP" data-shortcut-key="P" data-shortcut-shift="true"><span class="spotlight-option-label">Export as PDF</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-option" id="spotlightToggleTheme" role="option" aria-selected="false" data-spotlight-mode="commands" data-spotlight-action="toggle-theme" data-search="toggle switch dark light theme appearance" data-shortcut-code="KeyT" data-shortcut-key="T" data-shortcut-shift="true"><span class="spotlight-option-label">Toggle theme</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-option" id="spotlightShortcuts" role="option" aria-selected="false" data-spotlight-mode="commands" data-spotlight-action="shortcuts" data-search="keyboard shortcuts keys commands help" data-shortcut-code="Slash" data-shortcut-key="/"><span class="spotlight-option-label">Keyboard shortcuts</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-option" id="spotlightOverview" role="option" aria-selected="false" data-spotlight-mode="jump" data-spotlight-target="#overview" data-search="overview" data-shortcut-code="Digit1" data-shortcut-key="1" hidden><span class="spotlight-option-label">Overview</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-option" id="spotlightServices" role="option" aria-selected="false" data-spotlight-mode="jump" data-spotlight-target="#tables" data-search="services" data-shortcut-code="Digit2" data-shortcut-key="2" hidden><span class="spotlight-option-label">Services</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-option" id="spotlightLatency" role="option" aria-selected="false" data-spotlight-mode="jump" data-spotlight-target="#charts" data-search="latency" data-shortcut-code="Digit3" data-shortcut-key="3" hidden><span class="spotlight-option-label">Latency</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-option" id="spotlightRegions" role="option" aria-selected="false" data-spotlight-mode="jump" data-spotlight-target="#regions" data-search="regional health regions" data-shortcut-code="Digit4" data-shortcut-key="4" hidden><span class="spotlight-option-label">Regional health</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-option" id="spotlightIncidents" role="option" aria-selected="false" data-spotlight-mode="jump" data-spotlight-target="#incidents" data-search="incidents" data-shortcut-code="Digit5" data-shortcut-key="5" hidden><span class="spotlight-option-label">Incidents</span><span class="spotlight-shortcut" aria-hidden="true"></span></li>
    <li class="spotlight-empty" id="spotlightEmpty" role="presentation" hidden>No matching sections or commands</li>
  </ul>
  <span class="sr-only" id="spotlightStatus" aria-live="polite"></span>
</dialog>
