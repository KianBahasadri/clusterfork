<dialog class="modal-dialog toast-history-dialog" id="toastHistoryDialog" aria-labelledby="toastHistoryDialogTitle">
  <div class="modal-header">
    <h2 class="modal-title" id="toastHistoryDialogTitle">Toast history</h2>
    <button class="btn-icon" id="btnCloseToastHistory" type="button" aria-label="Close toast history"><svg class="icon" aria-hidden="true"><use href="#lucide-x"></use></svg></button>
  </div>
  <div class="modal-body toast-history-body">
    <ol class="toast-history-list" id="toastHistoryList"></ol>
  </div>
</dialog>
