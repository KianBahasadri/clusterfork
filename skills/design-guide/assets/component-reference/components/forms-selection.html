<!-- SECTION 4: Selection Controls -->
<section class="component-section" id="selection" aria-labelledby="heading-selection">
  <header class="section-header">
    <h2 class="section-index" id="heading-selection">04 Selection Controls</h2>
  </header>
  <div class="showcase-card">
    <div class="row-wrap" style="align-items: flex-start; gap: 36px;">
      <!-- Checkboxes -->
      <div class="showcase-group">
        <label class="control-row">
          <input class="sr-only" type="checkbox" checked>
          <span class="custom-checkbox" aria-hidden="true"><svg class="icon"><use href="#lucide-check"></use></svg></span>
          <span>Telemetry logging enabled</span>
        </label>
        <label class="control-row">
          <input class="sr-only" type="checkbox" id="indeterminateBox">
          <span class="custom-checkbox" aria-hidden="true" id="indeterminateMark"><svg class="icon"><use href="#lucide-minus"></use></svg></span>
          <span>Mixed regional sync</span>
        </label>
        <label class="control-row">
          <input class="sr-only" type="checkbox">
          <span class="custom-checkbox" aria-hidden="true"><svg class="icon"><use href="#lucide-check"></use></svg></span>
          <span>Strict TLS pinning</span>
        </label>
        <label class="control-row">
          <input class="sr-only" type="checkbox" checked disabled>
          <span class="custom-checkbox" aria-hidden="true"><svg class="icon"><use href="#lucide-check"></use></svg></span>
          <span>Audit logging required</span>
        </label>
      </div>

      <!-- Radios -->
      <fieldset class="showcase-group" style="border: none; padding: 0;">
        <legend class="sr-only">Update Cadence</legend>
        <label class="control-row">
          <input class="sr-only" type="radio" name="cadence" value="continuous" checked>
          <span class="custom-radio" aria-hidden="true"></span>
          <span>Continuous streaming</span>
        </label>
        <label class="control-row">
          <input class="sr-only" type="radio" name="cadence" value="batch">
          <span class="custom-radio" aria-hidden="true"></span>
          <span>15-minute batch</span>
        </label>
        <label class="control-row">
          <input class="sr-only" type="radio" name="cadence" value="manual">
          <span class="custom-radio" aria-hidden="true"></span>
          <span>Manual verification only</span>
        </label>
        <label class="control-row">
          <input class="sr-only" type="radio" name="cadence" value="legacy" disabled>
          <span class="custom-radio" aria-hidden="true"></span>
          <span>Legacy polling unavailable</span>
        </label>
      </fieldset>

      <!-- Toggle Switch -->
      <div class="showcase-group">
        <label class="control-row">
          <input class="sr-only switch-input" type="checkbox" role="switch" checked>
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span>Live stream telemetry</span>
        </label>
        <label class="control-row">
          <input class="sr-only switch-input" type="checkbox" role="switch">
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span>Debug verbose trace</span>
        </label>
        <label class="control-row">
          <input class="sr-only switch-input" type="checkbox" role="switch" checked disabled>
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span>Retention lock enforced</span>
        </label>
        <label class="control-row">
          <input class="sr-only switch-input" type="checkbox" role="switch" disabled>
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span>Remote debug unavailable</span>
        </label>
      </div>

      <!-- Sliders -->
      <div class="showcase-group range-group">
        <div class="range-control">
          <div class="range-control-heading">
            <label for="alertThreshold">Alert threshold</label>
            <output class="range-output" id="alertThresholdValue" for="alertThreshold">72%</output>
          </div>
          <input class="range-slider" id="alertThreshold" type="range" min="0" max="100" step="1" value="72" autocomplete="off" data-range-output="alertThresholdValue" data-range-suffix="%" data-range-aria-unit="percent" aria-valuetext="72 percent">
        </div>
        <div class="range-control">
          <div class="range-control-heading">
            <label for="workerReplicas">Worker replicas</label>
            <output class="range-output" id="workerReplicasValue" for="workerReplicas">3</output>
          </div>
          <div class="range-stepped">
            <input class="range-slider" id="workerReplicas" type="range" min="1" max="5" step="1" value="3" autocomplete="off" data-range-output="workerReplicasValue">
            <div class="range-step-labels" aria-hidden="true">
              <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
            </div>
          </div>
        </div>
        <div class="range-control">
          <div class="range-control-heading">
            <label for="capacityLimit">Capacity limit</label>
            <span class="range-control-values">
              <span class="range-scrub-rate" id="capacityScrubRate" aria-hidden="true">Scrub 1×</span>
              <output class="range-output range-output-wide" id="capacityLimitValue" for="capacityLimit">250,000 req/s</output>
            </span>
          </div>
          <input class="range-slider range-slider-precision" id="capacityLimit" type="range" min="0" max="1000000" step="100" value="250000" autocomplete="off" data-range-output="capacityLimitValue" data-range-suffix=" req/s" data-range-aria-unit="requests per second" data-range-grouped data-range-scrub-rate="capacityScrubRate" data-range-scrub-status="capacityScrubStatus" aria-valuetext="250000 requests per second" aria-describedby="capacityLimitHint">
          <span class="sr-only" id="capacityLimitHint">While dragging, move up or down for finer adjustment</span>
          <span class="sr-only" id="capacityScrubStatus" aria-live="polite">Normal scrub speed</span>
        </div>
        <div class="range-control range-control-disabled">
          <div class="range-control-heading">
            <label for="retentionWindow">Retention window</label>
            <output class="range-output" id="retentionWindowValue" for="retentionWindow">90 days</output>
          </div>
          <input class="range-slider" id="retentionWindow" type="range" min="30" max="180" step="30" value="90" autocomplete="off" data-range-output="retentionWindowValue" data-range-suffix=" days" data-range-aria-unit="days" aria-valuetext="90 days" disabled>
        </div>
      </div>
    </div>
  </div>
</section>
