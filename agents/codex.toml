# Codex settings.
#
# Top-level settings defined here and [hooks] tables are installed into
# ~/.codex/config.toml. The installer adds [mcp_servers] from
# agents/mcp-servers.json before that merge. Other settings (model, approvals,
# per-project trust levels written by Codex) are preserved. The installer also
# strips retired clusterfork keys (notify).
#
# Secrets stay in .env: Codex resolves env_http_headers and bearer_token_env_var
# from the environment at launch, and bash_profile.sh exports .env into every
# shell, so no API key is written into config.toml.

# Stop is root-turn only. Thread-spawned subagents fire SubagentStop instead,
# so they do not notify. async: don't hold the turn open for the notifier.
[[hooks.Stop]]
  [[hooks.Stop.hooks]]
  type = "command"
  command = "${HOME}/.config/clusterfork/bin/clusterfork-notify codex"
  async = true

# Failed requests bypass Stop. Filter PostModelRequest locally for root
# usage-limit failures; other attempts do not need attention.
[[hooks.PostModelRequest]]
  [[hooks.PostModelRequest.hooks]]
  type = "command"
  command = "${HOME}/.config/clusterfork/bin/clusterfork-notify codex --attention"
  async = true

# Approvals and questions can wait for a person before the turn ends.
[[hooks.PermissionRequest]]
  [[hooks.PermissionRequest.hooks]]
  type = "command"
  command = "${HOME}/.config/clusterfork/bin/clusterfork-notify codex --attention"
  async = true

[[hooks.PreToolUse]]
  matcher = "^request_user_input(_async)?$"
  [[hooks.PreToolUse.hooks]]
  type = "command"
  command = "${HOME}/.config/clusterfork/bin/clusterfork-notify codex --attention"
  async = true
