[cli]
auto_update = true
installer = "internal"

[ui]
max_thoughts_width = 120
theme = "tokyonight"
fork_secondary_model = "grok-4.5"
yolo = false
compact_mode = false
permission_mode = "always-approve"
prompt_suggestions = false

[features]
telemetry = false

[privacy]
privacy_banner_acked = "2026-08-18T05:13:39Z"

[marketplace]
default_skills_installs_purged = false
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[plugins]
enabled = []
disabled = ["chrome-devtools-mcp"]

[mcp_servers.chrome-devtools]
command = "pnpm"
args = [
    "dlx",
    "chrome-devtools-mcp@latest",
    "--no-usage-statistics",
    "--browserUrl",
    "http://127.0.0.1:9222",
]
enabled = false

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
enabled = false

[mcp_servers.pixellab]
url = "https://api.pixellab.ai/mcp"
enabled = false

[mcp_servers.pixellab.headers]
Authorization = "Bearer ${PIXELLAB_API_KEY}"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
enabled = true

[mcp_servers.context7.headers]
CONTEXT7_API_KEY = "${CONTEXT7_API_KEY}"
Accept = "application/json, text/event-stream"

[mcp_servers.ElevenLabs]
command = "bash"
args = ["-c", "exec \"$HOME/.config/clusterfork/bin/elevenlabs-mcp\""]
enabled = true

# Grok scans ~/.claude/settings.json Stop hooks by default. That would also
# fire clusterfork-notify claude at the end of a Grok turn (hooks: 2).
[compat.claude]
hooks = false

[[hooks.Stop]]
  [[hooks.Stop.hooks]]
  type = "command"
  command = "~/.config/clusterfork/bin/clusterfork-notify grok"
