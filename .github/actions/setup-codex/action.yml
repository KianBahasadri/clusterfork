name: Set up the Codex worker runtime
description: Install the pinned CLI and verify its read-only Linux sandbox without credentials.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dispatcher and validation dependencies
      shell: bash
      env:
        CLUSTERFORK_ACTION_PATH: ${{ github.action_path }}
      run: python3 -m pip install -r "$CLUSTERFORK_ACTION_PATH/../../../automation/requirements.txt"
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Prepare Ubuntu sandbox support
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes bubblewrap apparmor-profiles
        sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
    - name: Install pinned Codex CLI
      shell: bash
      run: npm install --global @openai/codex@0.165.0
    - name: Verify read-only sandbox enforcement
      shell: bash
      env:
        CLUSTERFORK_ACTION_PATH: ${{ github.action_path }}
      run: python3 "$CLUSTERFORK_ACTION_PATH/../../../automation/check_codex_sandbox.py"
