name: Deploy Azure dispatcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: clusterfork-azure-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'KianBahasadri/clusterfork' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: azure-production
    env:
      GH_TOKEN: ${{ github.token }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install deployment control dependencies
        run: python -m pip install -r automation/azure/requirements.txt azure-identity==1.27.0
      - name: Pause new workers, wait for CI, and drain active workers
        id: prepare
        run: python automation/deploy.py prepare --revision "$GITHUB_SHA"
      - name: Reconcile Azure infrastructure with Terraform
        if: steps.prepare.outputs.proceed == 'true'
        run: python automation/infrastructure.py apply
      - name: Deploy the tested package
        if: steps.prepare.outputs.proceed == 'true'
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: clusterfork-dispatch-7604cac329
          package: /tmp/clusterfork-function.zip
          remote-build: true
      - name: Verify the deployed revision and resume workers
        if: steps.prepare.outputs.proceed == 'true'
        run: python automation/deploy.py verify --revision "$GITHUB_SHA"
