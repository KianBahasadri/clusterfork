name: Deploy task controller

on:
  push:
    branches: [main]
    paths: ['.github/**', 'automation/**', 'infra/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: clusterfork-azure-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'KianBahasadri/clusterfork' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: azure-production
    env:
      GH_TOKEN: ${{ github.token }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install controller deployment dependencies
        run: python -m pip install -r automation/controller/requirements.txt
      - name: Test, drain, deploy and verify the required controller runtime
        id: deploy
        run: python automation/controller_deploy.py --revision "$GITHUB_SHA"
      - name: Verify controller telemetry and the saved Azure Monitor workbook
        if: steps.deploy.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 12
        run: python automation/controller_monitoring.py --revision "$GITHUB_SHA"
