name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate shell syntax
        run: |
          for script in install-clusterfork.sh bash_profile.sh shell/*.sh; do bash -n "$script"; done
          bash -c 'source bash_profile.sh; type _cf_tmux >/dev/null; for fn in cl cc ca o oc occ cmd ag; do type "$fn" >/dev/null; done; echo "all launchers sourceable"'
      - name: Compile codeview python
        run: python3 -m py_compile bin/codeview scripts/codeview/*.py
      - name: Verify upstream skill snapshots offline
        run: python3 scripts/sync_upstream_skills.py --check
      - name: Run tests
        run: |
          python3 -m pip install -r tests/requirements.txt -r symphony/requirements.txt
          env -u NO_COLOR python3 -m unittest discover -s tests -v
