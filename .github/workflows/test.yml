name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate shell syntax
        run: |
          for script in install-clusterfork.sh bash_profile.sh shell/*.sh; do bash -n "$script"; done
          bash -c 'source bash_profile.sh; type _cf_tmux >/dev/null; for fn in cl cc ca o oc occ cmd ag; do type "$fn" >/dev/null; done; echo "all launchers sourceable"'
      - name: Compile codeview python
        run: python3 -m py_compile bin/codeview scripts/codeview/*.py
      - name: Verify upstream skill snapshots offline
        run: python3 scripts/sync_upstream_skills.py --check
      - name: Run tests
        run: |
          python3 -m pip install -r tests/requirements.txt -r symphony/requirements.txt
          env -u NO_COLOR python3 -m unittest discover -s tests -v

  image:
    if: github.repository == 'KianBahasadri/clusterfork' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kianbahasadri/symphony
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build Symphony
        uses: docker/build-push-action@v7
        with:
          context: .
          file: symphony/Dockerfile
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          load: true
          push: false
          provenance: false
          build-args: SYMPHONY_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=symphony
      - name: Verify image tools and restricted user
        run: |
          docker run --rm -e EXPECTED_COMMIT="$GITHUB_SHA" --entrypoint sh "$IMAGE:$GITHUB_SHA" -ec '
            test "$(id -u)" = 10001
            test "$SYMPHONY_COMMIT" = "$EXPECTED_COMMIT"
            for name in git gh python uv node pnpm lua shellcheck terraform opencode codex jq rg sqlite3 tmux gawk patch file zip chromium; do
              command -v "$name"
            done
            HOME=/tmp XDG_CONFIG_HOME=/tmp XDG_CACHE_HOME=/tmp \
              chromium --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
                --user-data-dir=/tmp/chromium-check --dump-dom about:blank | grep -q "<html>"
            python -c "import symphony.__main__"
          '
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: symphony/Dockerfile
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          push: true
          provenance: false
          build-args: SYMPHONY_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=symphony
          cache-to: type=gha,scope=symphony,mode=max
