name: test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate Terraform without cloud credentials
        run: |
          for stack in infra/bootstrap infra/azure; do
            terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$stack" validate
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate shell syntax
        run: |
          bash -n bash_profile.sh
          bash -n shell/*.sh
          bash -c 'source bash_profile.sh; type _cf_tmux >/dev/null; for fn in cl cc ca o oc occ cmd ag; do type "$fn" >/dev/null; done; echo "all launchers sourceable"'
      - name: Compile codeview python
        run: python3 -m py_compile bin/codeview scripts/codeview/*.py
      - name: Run tests
        run: |
          python3 -m pip install -r automation/azure/requirements.txt
          python3 -m unittest discover -s tests -v

  routing-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dispatcher runtime dependencies
        run: python -m pip install -r automation/controller/requirements.txt
      - name: Verify controller runtime imports on the deployed Python version
        run: |
          python - <<'PY'
          import sys
          sys.path[:0] = ["automation", "automation/azure"]
          import controller_main
          from azure.identity import ManagedIdentityCredential
          PY
          bash -n automation/controller/host/install.sh
      - name: Index Azure Functions with the deployed Python version
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "automation/azure")
          import function_app
          names = {function.get_function_name() for function in function_app.app.get_functions()}
          assert names == {"health", "linear_webhook", "route_event", "reconcile", "worker"}, names
          print("All dispatcher and worker functions index on Python 3.12")
          PY
      - name: Index the stateless webhook ingress
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("webhook_ingress", "automation/webhook_relay/function_app.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          names = {function.get_function_name() for function in module.app.get_functions()}
          assert names == {"linear_relay", "health"}, names
          print("Only stateless HTTP ingress functions are registered")
          PY
      - uses: ./.github/actions/setup-codex
      - uses: ./.github/actions/setup-cursor
      - name: Verify Cursor read-only filesystem boundary without credentials
        run: python3 automation/check_cursor_sandbox.py
