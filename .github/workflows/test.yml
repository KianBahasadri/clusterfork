name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate shell syntax
        run: |
          bash -n bash_profile.sh
          bash -n shell/*.sh
          bash -c 'source bash_profile.sh; type _cf_tmux >/dev/null; for fn in cl cc ca o oc occ cmd ag; do type "$fn" >/dev/null; done; echo "all launchers sourceable"'
      - name: Compile codeview python
        run: python3 -m py_compile bin/codeview scripts/codeview/*.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  routing-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dispatcher runtime dependencies
        run: python -m pip install -r automation/azure/requirements.txt
      - name: Index Azure Functions with the deployed Python version
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "automation/azure")
          import function_app
          names = {function.get_function_name() for function in function_app.app.get_functions()}
          assert names == {"health", "linear_webhook", "route_event", "reconcile", "worker"}, names
          print("All dispatcher and worker functions index on Python 3.12")
          PY
