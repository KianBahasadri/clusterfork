name: Clusterfork coding-select

on:
  workflow_call:
    inputs:
      dispatch_key:
        required: true
        type: string
      worker_revision:
        required: true
        type: string
    outputs:
      selected:
        value: ${{ jobs.run.outputs.selected }}
permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      selected: ${{ steps.execute.outputs.selected }}
    steps:
      - name: Check out the approved runtime
        uses: actions/checkout@v4
        with:
          repository: KianBahasadri/clusterfork
          ref: ${{ inputs.worker_revision }}
          path: .clusterfork-runtime
          persist-credentials: false
      - uses: ./.clusterfork-runtime/.github/actions/setup-codex
      - uses: ./.clusterfork-runtime/.github/actions/setup-cursor
      - name: Authenticate this signed job role
        id: target
        env:
          CLUSTERFORK_BROKER_URL: ${{ vars.CLUSTERFORK_BROKER_URL }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
          WORKER_REVISION: ${{ inputs.worker_revision }}
          PREFLIGHT_ONLY: 'true'
        run: python3 "$GITHUB_WORKSPACE/.clusterfork-runtime/automation/controller_bootstrap.py"
      - name: Prepare isolated quota workspace
        run: mkdir -p "$GITHUB_WORKSPACE/.clusterfork-target"
      - name: Execute the authorized phase
        id: execute
        working-directory: .clusterfork-target
        env:
          CLUSTERFORK_BROKER_URL: ${{ vars.CLUSTERFORK_BROKER_URL }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: python3 "$GITHUB_WORKSPACE/.clusterfork-runtime/automation/worker.py" --select-account
