name: image

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symphony-image
  cancel-in-progress: true

jobs:
  image:
    if: >-
      github.repository == 'KianBahasadri/clusterfork' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.event != 'pull_request' &&
         github.event.workflow_run.conclusion == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kianbahasadri/symphony
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: docker/setup-buildx-action@v4
      - name: Build Symphony
        uses: docker/build-push-action@v7
        with:
          context: .
          file: symphony/Dockerfile
          tags: ${{ env.IMAGE }}:${{ env.TARGET_SHA }}
          load: true
          push: false
          provenance: false
          build-args: SYMPHONY_COMMIT=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=symphony
      - name: Verify image tools and restricted user
        run: |
          docker run --rm -e EXPECTED_COMMIT="$TARGET_SHA" --entrypoint sh "$IMAGE:$TARGET_SHA" -ec '
            test "$(id -u)" = 10001
            test "$SYMPHONY_COMMIT" = "$EXPECTED_COMMIT"
            for name in git gh python uv node pnpm lua shellcheck terraform opencode agy jq rg sqlite3 tmux gawk patch file zip; do
              command -v "$name"
            done
            test -s /app/symphony/web/mermaid.min.js
            python -c "import playwright, symphony.__main__"
          '
      - name: Launch managed Chromium as restricted user
        run: |
          docker run --rm -i \
            --user 10001:10001 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            -e HOME=/tmp \
            -e XDG_CACHE_HOME=/tmp/cache \
            -e XDG_CONFIG_HOME=/tmp/config \
            "$IMAGE:$TARGET_SHA" /opt/symphony/bin/python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          Path("/tmp/cache").mkdir(exist_ok=True)
          Path("/tmp/config").mkdir(exist_ok=True)
          page_path = Path("/tmp/playwright-check.html")
          page_path.write_text(
              "<!doctype html><html><head><title>Symphony Playwright check</title></head>"
              "<body><main id='target'>managed chromium</main></body></html>"
          )
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"],
              )
              try:
                  page = browser.new_page()
                  page.goto(page_path.as_uri())
                  assert page.title() == "Symphony Playwright check"
                  assert page.evaluate("document.querySelector('#target').textContent") == "managed chromium"
              finally:
                  browser.close()
          PY
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: symphony/Dockerfile
          tags: |
            ${{ env.IMAGE }}:${{ env.TARGET_SHA }}
            ${{ env.IMAGE }}:main
          push: true
          provenance: false
          build-args: SYMPHONY_COMMIT=${{ env.TARGET_SHA }}
          cache-from: type=gha,scope=symphony
          cache-to: type=gha,scope=symphony,mode=max
