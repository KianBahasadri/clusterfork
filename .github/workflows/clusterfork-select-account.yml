name: Clusterfork account preflight

on:
  workflow_call:
    inputs:
      dispatch_key:
        description: Durable dispatcher receipt key
        required: true
        type: string
      worker_revision:
        description: Full SHA of the reusable workflow and engine
        required: true
        type: string
    outputs:
      selected:
        description: Whether the broker has bound one account to this run
        value: ${{ jobs.select-account.outputs.selected }}

permissions:
  contents: read
  id-token: write

jobs:
  select-account:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - name: Bind the engine checkout to this reusable workflow revision
        env:
          WORKER_REVISION: ${{ inputs.worker_revision }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, re, urllib.request
          revision = os.environ['WORKER_REVISION']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('A full worker SHA is required')
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          request = urllib.request.Request(
              url + ('&' if '?' in url else '?') + 'audience=clusterfork-worker',
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)['value'].split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          if claims['job_workflow_sha'] != revision:
              raise SystemExit('Engine and reusable workflow must have the same SHA')
          PYTHON
      - name: Check out the pinned shared engine
        uses: actions/checkout@v4
        with:
          repository: KianBahasadri/clusterfork
          ref: ${{ inputs.worker_revision }}
          path: .clusterfork-runtime
          persist-credentials: false
      - uses: ./.clusterfork-runtime/.github/actions/setup-codex
      - uses: ./.clusterfork-runtime/.github/actions/setup-cursor
      - name: Keep the engine outside the target checkout
        run: mv "$GITHUB_WORKSPACE/.clusterfork-runtime" "$RUNNER_TEMP/clusterfork-runtime"
      - name: Check out the caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect quota and bind one account without agent execution
        id: select
        env:
          CLUSTERFORK_BROKER_URL: https://clusterfork-dispatch-7604cac329.azurewebsites.net/api/worker
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: python3 "$RUNNER_TEMP/clusterfork-runtime/automation/worker.py" --select-account
