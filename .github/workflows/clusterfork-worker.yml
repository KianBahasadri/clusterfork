name: Clusterfork Codex worker
run-name: "Clusterfork worker · ${{ inputs.linear_identifier }} · ${{ inputs.dispatch_key }}"

on:
  workflow_dispatch:
    inputs:
      linear_issue_id:
        description: Linear issue UUID
        required: true
        type: string
      linear_identifier:
        description: Linear issue identifier
        required: true
        type: string
      linear_project_id:
        description: Linear project UUID
        required: true
        type: string
      dispatch_key:
        description: Durable dispatcher receipt key
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: clusterfork-worker-${{ inputs.linear_issue_id }}
  cancel-in-progress: false

jobs:
  select-account:
    uses: ./.github/workflows/clusterfork-select-account.yml
    with:
      dispatch_key: ${{ inputs.dispatch_key }}

  develop:
    needs: select-account
    if: needs.select-account.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-codex
      - name: Implement issue and open a pull request
        env:
          CLUSTERFORK_BROKER_URL: https://clusterfork-dispatch-7604cac329.azurewebsites.net/api/worker
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: python3 automation/worker.py
