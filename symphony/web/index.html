<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symphony</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1><img src="/favicon.png" width="28" height="28" alt="">Symphony</h1>
    <div id="connection" role="status">Connecting…</div>
  </header>
  <main>
    <aside aria-label="Linear issues">
      <h2 class="sidebar-heading">Linear issues</h2>
      <div id="repos" role="tablist" aria-label="Repositories"></div>
      <p id="project-error" class="detail" role="status" hidden></p>
      <div id="issues" role="tabpanel" aria-label="Issues"></div>
    </aside>
    <section class="chat" aria-label="Coordinator chat">
      <div id="paused" class="notice" hidden></div>
      <div id="login" class="notice" hidden></div>
      <div id="chat-log" class="chat-log" role="log" aria-live="polite">
        <p id="welcome">Choose a repository or ask the coordinator to draft a plan.</p>
        <div id="messages"></div>
        <div id="stream"></div>
      </div>
      <form id="composer">
        <p id="turn-timing" hidden></p>
        <div class="command-entry">
          <span class="prompt" aria-hidden="true">›</span>
          <label class="sr-only" for="message">Message to the coordinator</label>
          <textarea id="message" rows="1" maxlength="23000" placeholder="Message Symphony or type /"
            enterkeyhint="send" autocapitalize="off" autocomplete="off" spellcheck="false" aria-autocomplete="list"
            aria-controls="command-list"></textarea>
          <ul id="command-list" role="listbox" aria-label="Slash command suggestions" hidden></ul>
        </div>
        <div class="composer-meta">
          <div id="codex-status" role="group" aria-label="Codex status">
            <span id="status-model">Codex</span>
            <span id="status-context" hidden></span>
            <span id="status-5h" hidden></span>
            <span id="status-weekly" hidden></span>
          </div>
          <span id="interrupt-hint" hidden>Esc to interrupt</span>
        </div>
        <p id="request-error" role="alert"></p>
      </form>
    </section>
  </main>
</body>
</html>
