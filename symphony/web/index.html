<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Symphony</title>
  <link rel="icon" href="/favicon.ico" type="image/vnd.microsoft.icon" sizes="16x16 32x32 48x48 64x64">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/issue.js" defer></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="lucide-calendar-days" viewBox="0 0 24 24">
      <path d="M8 2v3" />
      <path d="M16 2v3" />
      <rect x="3" y="3" width="18" height="18" rx="2" />
      <path d="M3 9h18" />
      <path d="M8 13h.01" />
      <path d="M12 13h.01" />
      <path d="M16 13h.01" />
      <path d="M8 17h.01" />
      <path d="M12 17h.01" />
      <path d="M16 17h.01" />
    </symbol>
    <symbol id="workflow-backlog" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.5" stroke-width="2.5" stroke-dasharray=".2 4.774" />
    </symbol>
    <symbol id="workflow-unstarted" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.5" stroke-width="2.5" />
    </symbol>
    <symbol id="workflow-started" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.5" stroke-width="2.5" />
      <path d="M12 5.75a6.25 6.25 0 0 1 0 12.5Z" fill="currentColor" stroke="none" />
    </symbol>
    <symbol id="workflow-completed" viewBox="0 0 24 24">
      <path fill="currentColor" stroke="none" fill-rule="evenodd"
        d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Z M6.5 12l3.5 3.5 7.5-7.5-1.5-1.5-6 6-2-2Z" />
    </symbol>
    <symbol id="workflow-canceled" viewBox="0 0 24 24">
      <path fill="currentColor" stroke="none" fill-rule="evenodd"
        d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Z M8 6.5l4 4 4-4L17.5 8l-4 4 4 4-1.5 1.5-4-4-4 4L6.5 16l4-4-4-4Z" />
    </symbol>
    <symbol id="workflow-duplicate" viewBox="0 0 24 24">
      <path fill="currentColor" stroke="none" fill-rule="evenodd"
        d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Z M6.5 13.5l7-7L15 8l-7 7Z M9 16l7-7 1.5 1.5-7 7Z" />
    </symbol>
    <symbol id="lucide-ellipsis" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="1" />
      <circle cx="19" cy="12" r="1" />
      <circle cx="5" cy="12" r="1" />
    </symbol>
    <symbol id="lucide-folder" viewBox="0 0 24 24">
      <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
    </symbol>
    <symbol id="lucide-layers" viewBox="0 0 24 24">
      <path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" />
      <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" />
      <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" />
    </symbol>
    <symbol id="lucide-octagon-alert" viewBox="0 0 24 24">
      <path d="M12 16h.01" />
      <path d="M12 8v4" />
      <path d="M15.312 2a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586l-4.688-4.688A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2z" />
    </symbol>
    <symbol id="lucide-signal-low" viewBox="0 0 24 24">
      <path d="M2 20h.01" />
      <path d="M7 20v-4" />
    </symbol>
    <symbol id="lucide-signal-medium" viewBox="0 0 24 24">
      <path d="M2 20h.01" />
      <path d="M7 20v-4" />
      <path d="M12 20v-8" />
    </symbol>
    <symbol id="lucide-signal" viewBox="0 0 24 24">
      <path d="M2 20h.01" />
      <path d="M7 20v-4" />
      <path d="M12 20v-8" />
      <path d="M17 20V8" />
      <path d="M22 4v16" />
    </symbol>
    <symbol id="lucide-triangle" viewBox="0 0 24 24">
      <path d="M13.73 4a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
    </symbol>
  </svg>
  <main>
    <aside aria-label="Linear issues">
      <h2 class="sidebar-heading">Linear issues</h2>
      <div id="repos" role="tablist" aria-label="Projects"></div>
      <p id="project-error" class="detail" role="status" hidden></p>
      <div id="issues" role="tabpanel" aria-label="Issues"></div>
    </aside>
    <section class="chat" aria-label="Coordinator chat">
      <div id="connection-error" class="notice" role="status" hidden>Connection lost. Reconnecting…</div>
      <div id="paused" class="notice" hidden></div>
      <div id="login" class="notice" hidden></div>
      <div id="chat-log" class="chat-log" role="log" aria-live="polite">
        <p id="welcome">Choose a repository or ask the coordinator to draft a plan.</p>
        <div id="messages"></div>
        <div id="stream"></div>
      </div>
      <form id="composer">
        <p id="turn-timing" hidden></p>
        <div class="command-entry">
          <label class="sr-only" for="message">Message to the coordinator</label>
          <textarea id="message" rows="1" maxlength="23000"
            enterkeyhint="send" autocapitalize="off" autocomplete="off" spellcheck="false" aria-autocomplete="list"
            aria-controls="command-list"></textarea>
          <ul id="command-list" role="listbox" aria-label="Slash command suggestions" hidden></ul>
        </div>
        <div class="composer-meta">
          <div id="codex-status" role="group" aria-label="Codex status">
            <span id="status-model">Codex</span>
            <span id="status-context" hidden></span>
            <span id="status-5h" hidden></span>
            <span id="status-weekly" hidden></span>
          </div>
          <button id="interrupt" type="button" aria-keyshortcuts="Escape" hidden>
            Interrupt <kbd aria-hidden="true">Esc</kbd>
          </button>
        </div>
        <p id="request-error" role="alert"></p>
      </form>
    </section>
  </main>
  <dialog id="issue-dialog" aria-labelledby="issue-dialog-title">
    <header class="issue-dialog-header">
      <p id="issue-dialog-identifier" class="muted"></p>
      <div class="issue-dialog-actions">
        <a id="issue-source" target="_blank" rel="noreferrer" hidden>Open in Linear</a>
        <button id="issue-close" type="button" autofocus>Close</button>
      </div>
    </header>
    <div id="issue-content" aria-busy="false">
      <h2 id="issue-dialog-title">Issue details</h2>
    </div>
  </dialog>
</body>
</html>
