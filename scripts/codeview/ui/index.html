<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeview</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header id="topbar">
  <span id="repo-name">…</span>
  <span id="head-info"></span>
  <span id="ci-info" hidden></span>
  <span id="stale-banner" hidden>cache stale</span>
</header>
<nav id="tabs" role="tablist" aria-label="Repository views"></nav>
<main id="panels">
  <section class="panel" id="panel-overview" data-panel="overview" role="tabpanel" aria-labelledby="tab-overview"><div class="loading">loading…</div></section>
  <section class="panel" id="panel-history" data-panel="history" role="tabpanel" aria-labelledby="tab-history" hidden><div class="loading">loading…</div></section>
  <section class="panel" id="panel-churn" data-panel="churn" role="tabpanel" aria-labelledby="tab-churn" hidden><div class="loading">loading…</div></section>
  <section class="panel" id="panel-files" data-panel="files" role="tabpanel" aria-labelledby="tab-files" hidden><div class="loading">loading…</div></section>
  <section class="panel" id="panel-deps" data-panel="deps" role="tabpanel" aria-labelledby="tab-deps" hidden><div class="loading">loading…</div></section>
  <section class="panel" id="panel-logs" data-panel="logs" role="tabpanel" aria-labelledby="tab-logs" hidden><div class="loading">loading…</div></section>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
