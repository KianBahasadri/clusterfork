# Hide every capture profile on the laptop's built-in audio controller.
# Output nodes on this controller continue to provide the speakers/headphones.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input[.]pci-0000_00_1f[.]3[.].*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input[.]usb-C-Media_Electronics_Inc[.]_USB_PnP_Sound_Device-00[.].*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
]
